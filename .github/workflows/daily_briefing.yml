name: Autonomous Daily Executive Briefing

on:
  schedule:
    # Runs at 00:00 UTC every day
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  run-daily-briefing:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Autonomous Daily Briefing Job
        run: |
          python daily_briefing_job.py

      - name: Commit and Push Updated Memory & Briefing Archive
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'actions@github.com'
          git add mock_data/persistent_memory.json mock_data/dynamic_events.json
          git diff-index --quiet HEAD || git commit -m "Auto-update Daily Executive Briefing & Memory Ledger [skip ci]"
          git push
